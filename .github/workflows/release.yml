name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./plugin.json').version")"
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::package.json ($VERSION) and plugin.json ($PLUGIN_VERSION) versions do not match"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; build/release will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        if: steps.existing.outputs.exists != 'true'
        run: pnpm run build

      - name: Package Decky plugin
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf out
          mkdir -p out/LibraryDoctor/dist
          cp dist/index.js out/LibraryDoctor/dist/index.js
          cp package.json plugin.json main.py README.md LICENSE out/LibraryDoctor/
          (
            cd out
            zip -qr "LibraryDoctor-v${VERSION}.zip" LibraryDoctor
          )
          ls -lh "out/LibraryDoctor-v${VERSION}.zip"

      - name: Create tag and GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "out/LibraryDoctor-v${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Library Doctor $TAG" \
            --generate-notes
